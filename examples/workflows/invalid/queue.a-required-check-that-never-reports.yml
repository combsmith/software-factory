# Must be rejected. With a path filter and no merge_group, a required check does not report and the merge waits for ever.
name: factory
on:
  pull_request:
    paths:
      - kernel/**
permissions: {}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
      - run: python3 -m tools.mutants
