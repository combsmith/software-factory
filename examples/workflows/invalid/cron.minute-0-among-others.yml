# Must be rejected. Every five minutes includes minute 0.
name: sf-tick
on:
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
jobs:
  tick:
    permissions:
      contents: read
    concurrency:
      group: sf-tick
      cancel-in-progress: false
    uses: combsmith/software-factory/.github/workflows/pass.yml@factory/v0-next
    secrets: inherit
