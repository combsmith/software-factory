# Must be rejected. Eleven lines is a script, and a script belongs where a test can call it.
name: factory
on:
  pull_request:
  merge_group:
permissions: {}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          make verify
          make verify
          make verify
          make verify
          make verify
          make verify
          make verify
          make verify
          make verify
          make verify
          make verify
        timeout-minutes: 1
      - run: python3 -m tools.mutants
        timeout-minutes: 1
