# Must be rejected. Eleven lines of shell is logic that no test can call.
name: factory
on:
  pull_request:
  merge_group:
permissions: {}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo step-1
          echo step-2
          echo step-3
          echo step-4
          echo step-5
          echo step-6
          echo step-7
          echo step-8
          echo step-9
          echo step-10
          make verify
      - run: python3 -m tools.mutants
