# Must be rejected. A cron with no space after its colon is no key to YAML, but a bare text, so under a schedule:
# in YAML's compact form it is read as an on: written as a list (Codex on #428).
name: sf-poller
on:
  workflow_dispatch:
  schedule:
  # three times an hour, off the hour; a comment here is no key
  - cron:"13 * * * *"
  - cron: "33 * * * *"
  - cron: "53 * * * *"
  workflow_run:
    workflows:
    - factory
    - ci
    - sf-run
    types:
    - completed
permissions: {}
jobs:
  pass:
    permissions:
      actions: write
      contents: read
    concurrency:
      group: sf-poller
      cancel-in-progress: false
    uses: combsmith/software-factory/.github/workflows/pass.yml@factory/v0-next
    secrets: inherit
