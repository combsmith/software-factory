# Must be rejected. A pull request's job runs the head's code, so it names no environment and is handed no key.
name: factory
on:
  pull_request:
  merge_group:
permissions: {}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: factory-poller
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
