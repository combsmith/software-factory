# Must be rejected. A job with no limit runs to the platform's six hours when a step hangs.
name: factory
on:
  pull_request:
  merge_group:
permissions: {}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
      - run: python3 -m tools.mutants
