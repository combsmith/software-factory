# Must be rejected. One of the org's own reusable workflows, called at a branch, runs whatever was merged last.
name: factory
on:
  pull_request:
  merge_group:
permissions: {}
jobs:
  shield:
    uses: petry-projects/.github/.github/workflows/agent-shield-reusable.yml@main
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
      - run: python3 -m tools.mutants
