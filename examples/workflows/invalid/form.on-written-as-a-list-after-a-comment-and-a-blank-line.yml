# Must be rejected. A comment and a blank line between on: and its items do not end the section, so the list is still
# read as a list (the Claude review's read of #416).
name: factory
on:
  # the events

  - pull_request_target
  - pull_request:
  - merge_group:
permissions: {}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
        timeout-minutes: 1
      - run: python3 -m tools.mutants
        timeout-minutes: 1
