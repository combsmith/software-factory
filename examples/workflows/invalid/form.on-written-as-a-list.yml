# Must be rejected. An on: written as a list is read only for its keyed items, so a bare pull_request_target beside
# them would be an event no rule here reads (Argon's read of #392).
name: factory
on:
  - pull_request_target
  - pull_request:
  - merge_group:
permissions: {}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
        timeout-minutes: 1
      - run: python3 -m tools.mutants
        timeout-minutes: 1
