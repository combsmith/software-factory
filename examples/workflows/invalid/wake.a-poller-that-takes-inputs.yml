# Must be rejected. The poller takes no input: what started it is read from its own run record.
name: sf-poller
on:
  schedule:
    - cron: "13 * * * *"
    - cron: "33 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      item:
        required: false
        type: string
  workflow_run:
    workflows:
      - factory
      - ci
      - sf-run
    types:
      - completed
permissions: {}
jobs:
  pass:
    permissions:
      actions: write
      contents: read
    concurrency:
      group: sf-poller
      cancel-in-progress: false
    uses: combsmith/software-factory/.github/workflows/pass.yml@factory/v0-next
    secrets: inherit
