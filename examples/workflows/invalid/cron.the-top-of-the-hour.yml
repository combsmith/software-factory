# Must be rejected. Schedules at minute 0 are the ones the platform delays and drops.
name: sf-tick
on:
  schedule:
    - cron: '0 * * * *'
permissions: {}
jobs:
  tick:
    permissions:
      contents: read
    concurrency:
      group: sf-tick
      cancel-in-progress: false
    uses: combsmith/software-factory/.github/workflows/pass.yml@factory/v0-next
