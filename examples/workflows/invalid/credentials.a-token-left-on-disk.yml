# Must be rejected. A checkout that keeps its credentials leaves a token where later steps can read it.
name: factory
on:
  pull_request:
  merge_group:
permissions: {}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make verify
        timeout-minutes: 1
      - run: python3 -m tools.mutants
        timeout-minutes: 1
