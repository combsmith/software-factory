# Must be rejected. Only the pass job, a Run's wake and its lane are granted a write, its actions: write, which starts the Runs; any other could delete run records.
name: factory
on:
  pull_request:
  merge_group:
permissions: {}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
        timeout-minutes: 1
