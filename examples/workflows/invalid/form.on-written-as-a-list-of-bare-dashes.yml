# Must be rejected. An item written as a bare dash, its event on the line below, is a list item too: it is no line
# of the narrow form (Argon's read of #416).
name: factory
on:
  -
    pull_request
  -
    merge_group
permissions: {}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
      - run: python3 -m tools.mutants
