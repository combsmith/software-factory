# Must pass. A schedule:'s crons may stand at the key's own indent, YAML's compact form, wherever schedule: stands
# among the events: each is the event's value, never an on: written as a list (Muse's read of #416).
name: sf-poller
on:
  workflow_dispatch:
  schedule:
  # three times an hour, off the hour; a comment here is no key
  - cron: "13 * * * *"
  - cron: "33 * * * *"
  - cron: "53 * * * *"
  workflow_run:
    workflows:
    - factory
    - ci
    - sf-run
    types:
    - completed
permissions: {}
jobs:
  pass:
    permissions:
      actions: write
      contents: read
    concurrency:
      group: sf-poller
      cancel-in-progress: false
    uses: combsmith/software-factory/.github/workflows/pass.yml@factory/v0-next
    secrets: inherit
