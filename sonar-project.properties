# SonarCloud project for this repo (org standard: combsmith/.github standards/ci-standards.md#3-sonarcloud-analysis).
sonar.projectKey=combsmith_software-factory
sonar.organization=combsmith
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**
# No coverage report is uploaded: nothing is installed to measure it, and the mutation check stands
# where a coverage threshold would (docs/decisions/0014). Without this, every pull request fails the
# gate's coverage condition on 0%.
sonar.coverage.exclusions=**/*
