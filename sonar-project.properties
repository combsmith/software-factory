# SonarCloud project for this repo (org standard: combsmith/.github standards/ci-standards.md#3-sonarcloud-analysis).
sonar.projectKey=combsmith_software-factory
sonar.organization=combsmith
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**
# No coverage report is uploaded: nothing is installed to measure it, and the mutation check stands
# where a coverage threshold would (docs/decisions/0014). Without this, every pull request fails the
# gate's coverage condition on 0%.
sonar.coverage.exclusions=**/*
# One rule set aside for one file: python:S5332 (clear-text HTTP) on tools/trial_p50_stub.py, P-50's stub of the model's
# API. It serves the pinned CLI on 127.0.0.1 alone, in the canary's workflow and this repo's tests, and HTTPS would need a
# local CA the CLI does not trust. tools/check_repo.py holds it to loopback; decision 0044's Boundaries row says why.
sonar.issue.ignore.multicriteria=p50stubhttp,contexttest,trialapptest
sonar.issue.ignore.multicriteria.p50stubhttp.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.p50stubhttp.resourceKey=tools/trial_p50_stub.py
# One rule set aside for two scripts: shell:S7688 (`[[` in place of `[`). It is style alone, and no finding of it is a
# defect. tools/trial_as_app.sh holds a credential's path and CI cannot run it for real, so it is not edited for style.
sonar.issue.ignore.multicriteria.contexttest.ruleKey=shell:S7688
sonar.issue.ignore.multicriteria.contexttest.resourceKey=tools/context_eval.sh
sonar.issue.ignore.multicriteria.trialapptest.ruleKey=shell:S7688
sonar.issue.ignore.multicriteria.trialapptest.resourceKey=tools/trial_as_app.sh
