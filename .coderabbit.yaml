# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# A third-party reviewer informs and never gates (docs/architecture/software-factory-design.md, §4.2).
# With approvals on, the reviewer requests changes and approves by itself, which blocks the merge queue.
# It reviews only when a member of the org asks, by a comment on the pull request, and neither reviews
# each push after that nor replies unasked (the Maintainer, 2026-10-28). An author may not have it
# approve their own pull request or resolve its threads.
#
# This file is the whole of the reviewer's configuration for this repo. Nothing is inherited from
# the org's settings, on purpose: what governs a review here is in the repo, where it is reviewed.
inheritance: false
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
  auto_approvals:
    enabled: false
    allow_author_approval: false
chat:
  auto_reply: false
  allow_non_org_members: false
