# The queue act's job and its wake, called by queue.yml at the Release's channel, with the item's lane on the calling job (decision 0128; issue 381).
# `queue`, on `factory-queue`, holds the queue App's key and the job's own token, which reads the pass record and nothing else; the step mints the App's token only for the one write its Decision names, and revokes it.
# It reads the Pause from the vars context and sends nothing under one. It checks out the Release, never the item's code; it leaves the Run's outcome whatever failed.
name: sf-queue-job
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      item:
        required: true
        type: string
      pass:
        required: true
        type: string
permissions: {}
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: factory-queue
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ job.workflow_sha }}
          fetch-tags: true
          persist-credentials: false
      - name: Make the queue act, if its Decision stands and no Pause is set
        env:
          NAME: ${{ inputs.name }}
          ITEM: ${{ inputs.item }}
          PASS: ${{ inputs.pass }}
          GITHUB_TOKEN: ${{ github.token }}
          QUEUE_APP_KEY: ${{ secrets.QUEUE_APP_KEY }}
          FACTORY_PAUSED: ${{ vars.FACTORY_PAUSED }}
        timeout-minutes: 4
        run: python3 -m harness.queue_step
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: applied
          path: applied/applied.json
          if-no-files-found: ignore
      - name: Leave the Run's outcome
        if: always()
        env:
          NAME: ${{ inputs.name }}
        timeout-minutes: 2
        run: python3 -m harness.outcome
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outcome
          path: outcome/outcome.json
          if-no-files-found: error
  wake:
    needs:
      - queue
    if: always() && (vars.FACTORY_PAUSED == '' || vars.FACTORY_PAUSED == 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Wake the next pass, since a Run the pass's token started wakes nothing when it ends
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        timeout-minutes: 2
        run: timeout 60 gh api -X POST "repos/$REPO/actions/workflows/poller.yml/dispatches" -f ref=main || echo "the next pass waits for the backstop"
