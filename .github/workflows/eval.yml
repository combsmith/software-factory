# The eval job, `factory / eval` (design §4.9 and §3.14, issue 309; decision 0053): the review Intent's held-out set, run
# on the commit it judges, main's own head, for the Release the dispatch names. Dispatched alone, by the Maintainer
# before a cut; the Release's gate reads its report (#197's ruling 4″). The dispatch names the set, the review Intent's
# where it names none (issue 612). The run is split into parts, each a job of its own (issue 611): the preflight's job,
# which asks a gate set's preflight and fails where it stops the dispatch, so no shard runs; a matrix of shards behind
# it, each with its own time limit, which asks its share of the set; and the merge job, which holds no credential and
# writes the one report from what each part uploaded, whatever became of them. Each job's steps are harness.eval's
# modules and pinned actions, in the order tools/check_workflows.py holds: the part planned before any credential is
# used; the CLI installed at the Engine's pin by its checksum, with the package the scrub needs, as root and before
# anything is here; each case, and its head, fetched with the Maintainer's read-only token for the home, held by that
# step alone, into a scratch directory outside the workspace; each case given to the review Intent with the model's
# credential alone, as a live Run is; for a gate set, the part's ledger sealed to the Maintainer's certificates and the
# ciphertext uploaded; and what the part found uploaded, counts alone for a gate set. Nothing of a case, a Result or
# the home reaches the log: each step prints counts and codes.
name: factory
on:
  workflow_dispatch:
    inputs:
      release:
        required: true
        type: string
      set:
        required: false
        type: string
        default: pr-review
permissions: {}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    environment: factory-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m harness.eval.plan
        timeout-minutes: 1
        env:
          RELEASE: ${{ inputs.release }}
          EVAL_SET: ${{ inputs.set }}
          EVAL_PART: preflight
      - env:
          CLI_VERSION: "2.1.306"
          CLI_CHECKSUM: "520bc6c1f40af466bd03a278b5ae1af1a2938bc7de5b9e5cb15526da20d71cfe"
        timeout-minutes: 3
        run: |
          url="https://downloads.claude.ai/claude-code-releases/${CLI_VERSION}/linux-x64/claude"
          curl -sSfL --proto '=https' --proto-redir '=https' -o /tmp/claude "${url}"
          echo "${CLI_CHECKSUM}  /tmp/claude" | sha256sum -c
          chmod 0755 /tmp/claude
          sudo mv /tmp/claude /usr/local/bin/claude
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap
      - run: python3 -m harness.eval.fetch
        timeout-minutes: 3
        env:
          HELDOUT_TOKEN: ${{ secrets.HELDOUT_TOKEN }}
          HELDOUT_OWNER: ${{ secrets.HELDOUT_OWNER }}
          HELDOUT_REPO: ${{ secrets.HELDOUT_REPO }}
      - run: python3 -m harness.eval.run
        timeout-minutes: 109
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLI: /usr/local/bin/claude
      - run: python3 -m harness.eval.seal
        timeout-minutes: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-ledger-preflight
          path: eval-ledger.cms
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-part-preflight
          path: eval-part.json
          if-no-files-found: error
          retention-days: 90
      - run: python3 -m harness.eval.judge
        timeout-minutes: 1
  eval:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    environment: factory-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m harness.eval.plan
        timeout-minutes: 1
        env:
          RELEASE: ${{ inputs.release }}
          EVAL_SET: ${{ inputs.set }}
          EVAL_PART: ${{ matrix.shard }}
      - env:
          CLI_VERSION: "2.1.306"
          CLI_CHECKSUM: "520bc6c1f40af466bd03a278b5ae1af1a2938bc7de5b9e5cb15526da20d71cfe"
        timeout-minutes: 3
        run: |
          url="https://downloads.claude.ai/claude-code-releases/${CLI_VERSION}/linux-x64/claude"
          curl -sSfL --proto '=https' --proto-redir '=https' -o /tmp/claude "${url}"
          echo "${CLI_CHECKSUM}  /tmp/claude" | sha256sum -c
          chmod 0755 /tmp/claude
          sudo mv /tmp/claude /usr/local/bin/claude
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap
      - run: python3 -m harness.eval.fetch
        timeout-minutes: 3
        env:
          HELDOUT_TOKEN: ${{ secrets.HELDOUT_TOKEN }}
          HELDOUT_OWNER: ${{ secrets.HELDOUT_OWNER }}
          HELDOUT_REPO: ${{ secrets.HELDOUT_REPO }}
      - run: python3 -m harness.eval.run
        timeout-minutes: 109
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLI: /usr/local/bin/claude
      - run: python3 -m harness.eval.seal
        timeout-minutes: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-ledger-${{ matrix.shard }}
          path: eval-ledger.cms
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-part-${{ matrix.shard }}
          path: eval-part.json
          if-no-files-found: error
          retention-days: 90
  merge:
    needs:
      - preflight
      - eval
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ledger_sha256: ${{ steps.merge.outputs.ledger_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m harness.eval.plan
        timeout-minutes: 1
        env:
          RELEASE: ${{ inputs.release }}
          EVAL_SET: ${{ inputs.set }}
          EVAL_PART: merge
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eval-part-*
          path: parts
      - run: python3 -m harness.eval.merge
        id: merge
        timeout-minutes: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: error
          retention-days: 90
      - run: python3 -m harness.eval.judge
        timeout-minutes: 1
