# The eval job, `factory / eval` (design §4.9 and §3.14, issue 309; decision 0053): the review Intent's held-out set, run
# on the commit it judges, main's own head, for the Release the dispatch names. Dispatched alone, by the Maintainer
# before a cut; the Release's gate reads its report (#197's ruling 4″). Its steps are harness.eval's modules and pinned
# actions, in the order tools/check_workflows.py holds:
# the set planned before any credential is used; each case fetched with the Maintainer's read-only token for the home,
# held by that step alone, into a scratch directory outside the workspace; the CLI installed at the Engine's pin by its
# checksum; each case given to the review Intent with the model's credential alone, as a live Run is; the report, of
# hashes, verdicts and codes alone, uploaded whatever the verdicts; and the run judged by the gate's own test.
# Nothing of a case, a Result or the home reaches the log: each step prints counts and codes.
name: factory
on:
  workflow_dispatch:
    inputs:
      release:
        required: true
        type: string
permissions: {}
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    environment: factory-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m harness.eval.plan
        timeout-minutes: 1
        env:
          RELEASE: ${{ inputs.release }}
      - run: python3 -m harness.eval.fetch
        timeout-minutes: 3
        env:
          HELDOUT_TOKEN: ${{ secrets.HELDOUT_TOKEN }}
          HELDOUT_OWNER: ${{ secrets.HELDOUT_OWNER }}
          HELDOUT_REPO: ${{ secrets.HELDOUT_REPO }}
      - env:
          CLI_VERSION: "2.1.306"
          CLI_CHECKSUM: "520bc6c1f40af466bd03a278b5ae1af1a2938bc7de5b9e5cb15526da20d71cfe"
        timeout-minutes: 3
        run: |
          url="https://downloads.claude.ai/claude-code-releases/${CLI_VERSION}/linux-x64/claude"
          curl -sSfL --proto '=https' --proto-redir '=https' -o /tmp/claude "${url}"
          echo "${CLI_CHECKSUM}  /tmp/claude" | sha256sum -c
          chmod 0755 /tmp/claude
          sudo mv /tmp/claude /usr/local/bin/claude
      - run: python3 -m harness.eval.run
        timeout-minutes: 111
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLI: /usr/local/bin/claude
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: error
          retention-days: 90
      - run: python3 -m harness.eval.judge
        timeout-minutes: 1
