# The org's secret scan: petry-projects/.github, push-protection.md, "Required CI job". It is the one
# workflow here that downloads a program. tools/check_workflows.py exempts it from that rule alone,
# by name, and holds it to this text by its hash: to change it, change the entry there too.
# One line differs from the org's: the download is by curl held to HTTPS, redirects included.
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
permissions: {}
jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CHECKSUM: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL --proto '=https' --proto-redir '=https' -o /tmp/gitleaks.tar.gz "${url}"
          echo "${GITLEAKS_CHECKSUM}  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
