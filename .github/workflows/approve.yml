# The approving act's shim, frozen: it calls the act's job at the channel, in its item's lane, only on a first
# attempt with no Pause set, dispatched by 41898282, the account the pass's own token runs as (and every workflow's
# token here, so the check's rule that only the pass job may dispatch is what holds it). tools/check_workflows.py
# holds it word for word, as APPROVE_SHIM, and by its hash in SHIMS (issue 196; decisions 0055, 0057 and 0115).
name: sf-approve
run-name: ${{ inputs.name }}
on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        type: string
      item:
        required: true
        type: string
      pass:
        required: true
        type: string
permissions: {}
jobs:
  lane:
    if: github.actor_id == '41898282' && github.run_attempt == '1' && (vars.FACTORY_PAUSED == '' || vars.FACTORY_PAUSED == 'false')
    permissions:
      actions: write
      contents: read
    concurrency:
      group: ${{ inputs.item }}
      cancel-in-progress: false
    uses: combsmith/software-factory/.github/workflows/approve-job.yml@factory/v0-next
    secrets: inherit
    with:
      name: ${{ inputs.name }}
      item: ${{ inputs.item }}
      pass: ${{ inputs.pass }}
