# The org's SonarCloud analysis (combsmith/.github standards/workflows/sonarcloud.yml), written to this
# repo's workflow rules: it also runs on merge_group, sets a timeout and a versioned runner, keeps no
# checkout credentials, and has no continue-on-error retry. The job name `SonarCloud` is the org's check name.
# The scan is guarded on SONAR_TOKEN, so the job is a green no-op where the secret is not available.
name: SonarCloud Analysis
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
permissions: {}
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
