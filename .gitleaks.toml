title = "gitleaks config"

# gitleaks adds its default rules to a config file only when it is told to. Without this the
# scan has no rules at all and finds nothing (found 2026-10-17 on gitleaks 8.30.1).
[extend]
useDefault = true

# Add repo-specific allowlists below.
# Common false-positive paths:
#   '''_bmad/'''  — BMAD knowledge/config files (not application secrets)
[allowlist]
description = "Allowlisted paths"
paths = [
  '''_bmad/''',
]
